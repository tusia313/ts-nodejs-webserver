<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 Not Found | TypeScript Web Server</title>
     <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@500;700&display=swap"
        rel="stylesheet">

</head>

<body>
    <div class="container">
        <nav>
            <ul>
                <li><a href="/">Home</a></li>
                <li><a href="/about">About</a></li>
                <li><a href="/dad-joke">Dad Joke</a></li>
            </ul>
        </nav>

        <main class="card">
            <span class="badge">HTTP Status: 404</span>
            <h1>Oops! Page Not Found.</h1>
            <p>The route you requested doesn't exist on this server. Even the best dad jokes can't save a broken URL.
            </p>
            <a href="/" class="home-btn">← Back to Home</a>
        </main>
    </div>
</body>

</html>
