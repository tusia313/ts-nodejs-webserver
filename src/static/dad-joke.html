<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Typical Dad Jokes | ui.dev style</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0f1117;
            --card-bg: #181b24;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-yellow: #facc15;
            --accent-blue: #38bdf8;
            --border-color: #2e3446;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-dark);
            background-image: radial-gradient(var(--border-color) 1px, transparent 1px);
            background-size: 24px 24px;
            color: var(--text-main);
            font-family: 'Inter', -apple-system, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .container {
            max-width: 640px;
            width: 100%;
        }

        nav {
            margin-bottom: 2rem;
        }

        nav ul {
            list-style: none;
            display: flex;
            gap: 0.75rem;
            background: var(--card-bg);
            padding: 0.5rem;
            border-radius: 12px;
            border: 2px solid var(--border-color);
            width: fit-content;
        }

        nav a {
            color: var(--text-muted);
            text-decoration: none;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.85rem;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            transition: all 0.15s ease;
            display: block;
        }

        nav a:hover {
            color: var(--text-main);
            background: rgba(255, 255, 255, 0.05);
        }

        nav a[href="/dad-joke"] {
            background: var(--accent-yellow);
            color: #000;
            font-weight: 600;
        }

        .card {
            background: var(--card-bg);
            border: 2px solid var(--text-main);
            border-radius: 16px;
            padding: 2.5rem;
            box-shadow: 8px 8px 0px var(--accent-yellow);
            position: relative;
        }

        .badge {
            display: inline-block;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            background: rgba(56, 189, 248, 0.12);
            color: var(--accent-blue);
            border: 1px solid var(--accent-blue);
            padding: 0.3rem 0.75rem;
            border-radius: 999px;
            margin-bottom: 1.25rem;
        }

        h1 {
            font-size: 1.85rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            margin-bottom: 1.5rem;
            line-height: 1.2;
        }

        .joke-text {
            font-size: 1.25rem;
            line-height: 1.6;
            color: var(--accent-yellow);
            font-weight: 600;
            padding: 1.5rem;
            background: rgba(0, 0, 0, 0.35);
            border-left: 4px solid var(--accent-blue);
            border-radius: 0 8px 8px 0;
            margin-bottom: 1.75rem;
        }

        .refresh-btn {
            display: inline-block;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.85rem;
            font-weight: 600;
            background: var(--text-main);
            color: var(--bg-dark);
            text-decoration: none;
            padding: 0.75rem 1.25rem;
            border-radius: 8px;
            border: 2px solid var(--text-main);
            transition: transform 0.1s ease, box-shadow 0.1s ease;
        }

        .refresh-btn:hover {
            transform: translate(-2px, -2px);
            box-shadow: 4px 4px 0px var(--accent-blue);
        }
    </style>
</head>
<body>
    <div class="container">
        <nav>
            <ul>
                <li><a href="/">Home</a></li>
                <li><a href="/about">About</a></li>
                <li><a href="/dad-joke">Dad Joke</a></li>
            </ul>
        </nav>

        <main class="card">
            <span class="badge">API: icanhazdadjoke.com</span>
            <h1>Here is a Typical Dad Joke:</h1>
            <p class="joke-text">{{joke}}</p>
            <a href="/dad-joke" class="refresh-btn">Get Another Joke ↻</a>
        </main>
    </div>
</body>
</html>
